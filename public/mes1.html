<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PubNub Chat App</title>
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.10.0.0.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
        }
        #chat-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            padding: 20px;
        }
        #messages {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        #message-input {
            width: calc(100% - 90px);
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-right: 10px;
        }
        #send-button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #send-button:hover {
            background-color: #0056b3;
        }
        .message {
            margin: 5px 0;
            padding: 8px;
            border-radius: 4px;
        }
        .sent {
            background-color: #e1f5fe;
            margin-left: 20%;
            text-align: right;
        }
        .received {
            background-color: #f5f5f5;
            margin-right: 20%;
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="messages"></div>
        <input type="text" id="message-input" placeholder="Type a message...">
        <button id="send-button">Send</button>
    </div>
    <script>
        // Initialize PubNub
        const pubnub = new PubNub({
            publishKey: 'YOUR_PUBLISH_KEY', // Replace with your PubNub publish key
            subscribeKey: 'YOUR_SUBSCRIBE_KEY', // Replace with your PubNub subscribe key
            userId: 'user-' + Math.random().toString(36).substr(2, 9) // Unique user ID
        });

        // Subscribe to a channel
        const channel = 'chat-channel';
        pubnub.subscribe({ channels: [channel] });

        // Display messages
        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');

        // Listen for messages
        pubnub.addListener({
            message: function(event) {
                const message = event.message;
                const isOwnMessage = event.publisher === pubnub.getUUID();
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message ' + (isOwnMessage ? 'sent' : 'received');
                messageDiv.textContent = message;
                messagesDiv.appendChild(messageDiv);
                messagesDiv.scrollTop = messagesDiv.scrollHeight; // Auto-scroll to bottom
            }
        });

        // Send message
        function sendMessage() {
            const message = messageInput.value.trim();
            if (message) {
                pubnub.publish({
                    channel: channel,
                    message: message
                }, function(status, response) {
                    if (status.error) {
                        console.error('Error publishing message:', status);
                    } else {
                        messageInput.value = ''; // Clear input
                    }
                });
            }
        }

        // Send message on button click
        sendButton.addEventListener('click', sendMessage);

        // Send message on Enter key
        messageInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
